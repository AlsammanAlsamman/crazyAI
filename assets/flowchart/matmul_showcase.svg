<text x="950" y="46" font-size="30" font-weight="800" fill="#f4f4ff" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.4" font-style="normal" opacity="1">crazyAI × matrix multiplication</text><text x="950" y="74" font-size="13.5" font-weight="400" fill="#a9abc9" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">the best kernels invent has found, ranked by value = speedup vs. a cache-blocked loop × exactness</text><text x="60" y="92" font-size="12" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">TOP 5 ARCHIVED RUNS, BY VALUE</text><text x="136" y="131" font-size="13.5" font-weight="700" fill="#f4f4ff" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">seed 3</text><rect x="150" y="106" width="1250" height="40" rx="8" fill="#23264d" stroke="#3b3f7a"/><rect x="150" y="106" width="1250" height="40" rx="8" fill="url(#barTop)" opacity="1"/><text x="1424" y="131" font-size="14" font-weight="700" fill="#ff7f50" text-anchor="start" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">16.01×</text><text x="136" y="179" font-size="13.5" font-weight="700" fill="#f4f4ff" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">seed 3004</text><rect x="150" y="154" width="1250" height="40" rx="8" fill="#23264d" stroke="#3b3f7a"/><rect x="150" y="154" width="1107.7629278041468" height="40" rx="8" fill="url(#barTop)" opacity="1"/><text x="1424" y="179" font-size="14" font-weight="700" fill="#ff7f50" text-anchor="start" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">14.19×</text><text x="136" y="227" font-size="13.5" font-weight="700" fill="#f4f4ff" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">seed 42</text><rect x="150" y="202" width="1250" height="40" rx="8" fill="#23264d" stroke="#3b3f7a"/><rect x="150" y="202" width="893.5485885585811" height="40" rx="8" fill="url(#barTop)" opacity="1"/><text x="1424" y="227" font-size="14" font-weight="700" fill="#ff7f50" text-anchor="start" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">11.45×</text><text x="136" y="275" font-size="13.5" font-weight="400" fill="#f4f4ff" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">seed 4002</text><rect x="150" y="250" width="1250" height="40" rx="8" fill="#23264d" stroke="#3b3f7a"/><rect x="150" y="250" width="814.3111416437671" height="40" rx="8" fill="#3b3f7a" opacity="0.9"/><text x="1424" y="275" font-size="14" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">10.43×</text><text x="136" y="323" font-size="13.5" font-weight="400" fill="#f4f4ff" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">seed 3005</text><rect x="150" y="298" width="1250" height="40" rx="8" fill="#23264d" stroke="#3b3f7a"/><rect x="150" y="298" width="764.6608793404946" height="40" rx="8" fill="#3b3f7a" opacity="0.9"/><text x="1424" y="323" font-size="14" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">9.79×</text><rect x="60" y="400" width="570.6666666666666" height="430" rx="18" fill="#23264d" stroke="#3b3f7a" stroke-width="1.5" filter="url(#shadow)"/><rect x="60" y="400" width="570.6666666666666" height="7" rx="3.5" fill="#ff7f50"/><circle cx="94" cy="446" r="20" fill="#ff7f50"/><text x="94" y="453" font-size="17" font-weight="800" fill="#0f1022" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">#1</text><text x="126" y="442" font-size="17" font-weight="800" fill="#f4f4ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">seed 3</text><text x="126" y="462" font-size="12" font-weight="600" fill="#ffbf00" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">evolve blend</text><text x="606.6666666666666" y="448" font-size="30" font-weight="800" fill="#ff7f50" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">16.0</text><text x="606.6666666666666" y="466" font-size="10" font-weight="400" fill="#a9abc9" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">value (× blocked loop)</text><text x="86" y="508" font-size="10.5" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">THE STORY</text><text x="86" y="532" font-size="13" font-weight="400" fill="#dfe1ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="italic" opacity="1">“Every boulder crosses in a covered cart —</text><text x="86" y="552" font-size="13" font-weight="400" fill="#dfe1ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="italic" opacity="1">unglanced, unswerving — ground on the quern</text><text x="86" y="572" font-size="13" font-weight="400" fill="#dfe1ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="italic" opacity="1">and stacked, stone on stone, on the cairn.”</text><text x="86" y="614" font-size="10.5" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">ASSUMPTION BROKEN</text><text x="86" y="636" font-size="12.5" font-weight="400" fill="#00ced1" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">“the sum over k finishes before the”</text><text x="86" y="655" font-size="12.5" font-weight="400" fill="#00ced1" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">“next cell starts”</text><text x="86" y="692" font-size="10.5" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">WHAT IT BECAME</text><text x="86" y="714" font-size="12" font-weight="400" fill="#f4f4ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">Partial sums live only in registers (the “cart”);</text><text x="86" y="732" font-size="12" font-weight="400" fill="#f4f4ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">C is written exactly once, after the full k-sum.</text><rect x="664.6666666666666" y="400" width="570.6666666666666" height="430" rx="18" fill="#23264d" stroke="#3b3f7a" stroke-width="1.5" filter="url(#shadow)"/><rect x="664.6666666666666" y="400" width="570.6666666666666" height="7" rx="3.5" fill="#ff7f50"/><circle cx="698.6666666666666" cy="446" r="20" fill="#ff7f50"/><text x="698.6666666666666" y="453" font-size="17" font-weight="800" fill="#0f1022" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">#2</text><text x="730.6666666666666" y="442" font-size="17" font-weight="800" fill="#f4f4ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">seed 3004</text><text x="730.6666666666666" y="462" font-size="12" font-weight="600" fill="#ffbf00" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">graft blend</text><text x="1211.3333333333333" y="448" font-size="30" font-weight="800" fill="#ff7f50" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">14.2</text><text x="1211.3333333333333" y="466" font-size="10" font-weight="400" fill="#a9abc9" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">value (× blocked loop)</text><text x="690.6666666666666" y="508" font-size="10.5" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">THE STORY</text><text x="690.6666666666666" y="532" font-size="13" font-weight="400" fill="#dfe1ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="italic" opacity="1">“Sparrows carry each door’s product into the</text><text x="690.6666666666666" y="552" font-size="13" font-weight="400" fill="#dfe1ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="italic" opacity="1">granary where two fields’ shadows cross —</text><text x="690.6666666666666" y="572" font-size="13" font-weight="400" fill="#dfe1ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="italic" opacity="1">flight, not arithmetic.”</text><text x="690.6666666666666" y="614" font-size="10.5" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">ASSUMPTION BROKEN</text><text x="690.6666666666666" y="636" font-size="12.5" font-weight="400" fill="#00ced1" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">“a matrix lives in one memory”</text><text x="690.6666666666666" y="673" font-size="10.5" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">WHAT IT BECAME</text><text x="690.6666666666666" y="695" font-size="12" font-weight="400" fill="#f4f4ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">Two independent FMA accumulator chains per row;</text><text x="690.6666666666666" y="713" font-size="12" font-weight="400" fill="#f4f4ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">A and B are read in place, never repacked.</text><rect x="1269.3333333333333" y="400" width="570.6666666666666" height="430" rx="18" fill="#23264d" stroke="#3b3f7a" stroke-width="1.5" filter="url(#shadow)"/><rect x="1269.3333333333333" y="400" width="570.6666666666666" height="7" rx="3.5" fill="#ff7f50"/><circle cx="1303.3333333333333" cy="446" r="20" fill="#ff7f50"/><text x="1303.3333333333333" y="453" font-size="17" font-weight="800" fill="#0f1022" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">#3</text><text x="1335.3333333333333" y="442" font-size="17" font-weight="800" fill="#f4f4ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">seed 42</text><text x="1335.3333333333333" y="462" font-size="12" font-weight="600" fill="#ffbf00" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">anneal blend</text><text x="1816" y="448" font-size="30" font-weight="800" fill="#ff7f50" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">121</text><text x="1816" y="466" font-size="10" font-weight="400" fill="#a9abc9" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">GFLOP/s @ n=1024 (first machine)</text><text x="1295.3333333333333" y="508" font-size="10.5" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">THE STORY</text><text x="1295.3333333333333" y="532" font-size="13" font-weight="400" fill="#dfe1ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="italic" opacity="1">“Coral polyps eat coats hung along a pipe;</text><text x="1295.3333333333333" y="552" font-size="13" font-weight="400" fill="#dfe1ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="italic" opacity="1">the smoke of every product drifts into one fog</text><text x="1295.3333333333333" y="572" font-size="13" font-weight="400" fill="#dfe1ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="italic" opacity="1">that only gives up its embers when it has finished.”</text><text x="1295.3333333333333" y="614" font-size="10.5" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">ASSUMPTION BROKEN</text><text x="1295.3333333333333" y="636" font-size="12.5" font-weight="400" fill="#00ced1" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">“n³ multiplications are needed”</text><text x="1295.3333333333333" y="673" font-size="10.5" font-weight="700" fill="#a9abc9" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8" font-style="normal" opacity="1">WHAT IT BECAME</text><text x="1295.3333333333333" y="695" font-size="12" font-weight="400" fill="#f4f4ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">Full-k register accumulation, zero partial-C traffic;</text><text x="1295.3333333333333" y="713" font-size="12" font-weight="400" fill="#f4f4ff" text-anchor="start" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">8×24 AVX-512 tile — the project's headline result.</text><text x="950" y="866" font-size="11.5" font-weight="400" fill="#a9abc9" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0" font-style="normal" opacity="1">full stories, C source and honest caveats (n=1024, real OpenBLAS re-checks) in the README and archive/invent_&lt;seed&gt;_matmul/</text><text x="950" y="886" font-size="11" font-weight="400" fill="#8a8dbf" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" letter-spacing="0" font-style="normal" opacity="1">crazyai invent-rank --target matmul</text></svg>