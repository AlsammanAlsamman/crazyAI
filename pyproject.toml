[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crazyai"
version = "0.2.1"
description = "The impossible, disguised as possible and true - built and measured by Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0",
    "sympy>=1.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
crazyai = "crazyai.cli:main"

[tool.setuptools.packages.find]
include = ["crazyai*"]

[tool.setuptools.package-data]
crazyai = ["data/domains/*.yaml", "data/imagination/*.yaml", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
